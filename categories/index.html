    <h1>Essays</h1>
    <p>Essays and notes on architecture, computation, and design cognition.</p>

<div class="post-filter-toolbar" id="post-filter-toolbar">
    <button class="filter-btn active" data-filter="en">English <span class="filter-count" id="count-en">0</span></button>
    <button class="filter-btn" data-filter="id">Bahasa Indonesia <span class="filter-count" id="count-id">0</span></button>
    <button class="filter-btn" data-filter="all">All <span class="filter-count" id="count-all">0</span></button>
</div>

<div class="post-feed" id="post-feed">
    
</div>

<div id="no-posts-msg" style="display:none; padding: 40px 0; color: var(--color-navy-muted); text-align: center;">
    Tidak ada artikel dalam pilihan bahasa ini.
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const filterBtns = document.querySelectorAll(".filter-btn");
        const posts = document.querySelectorAll(".post-feed .post-preview");
        const noPostsMsg = document.getElementById("no-posts-msg");

        
        let countAll = posts.length;
        let countId = 0;
        let countEn = 0;

        posts.forEach(post => {
            const lang = post.getAttribute("data-lang");
            if (lang === "id") countId++;
            else countEn++;
        });

        const countAllEl = document.getElementById("count-all");
        const countIdEl = document.getElementById("count-id");
        const countEnEl = document.getElementById("count-en");

        if (countAllEl) countAllEl.textContent = countAll;
        if (countIdEl) countIdEl.textContent = countId;
        if (countEnEl) countEnEl.textContent = countEn;

        function applyFilter(filter) {
            let visibleCount = 0;
            posts.forEach(post => {
                const lang = post.getAttribute("data-lang");
                if (filter === "all" || lang === filter) {
                    post.classList.remove("is-hidden");
                    visibleCount++;
                } else {
                    post.classList.add("is-hidden");
                }
            });

            filterBtns.forEach(btn => {
                if (btn.getAttribute("data-filter") === filter) {
                    btn.classList.add("active");
                } else {
                    btn.classList.remove("active");
                }
            });

            if (noPostsMsg) {
                noPostsMsg.style.display = visibleCount === 0 ? "block" : "none";
            }
        }

        filterBtns.forEach(btn => {
            btn.addEventListener("click", () => {
                const filter = btn.getAttribute("data-filter");
                if (filter === "en") {
                    history.replaceState(null, "", window.location.pathname);
                } else {
                    window.location.hash = filter;
                }
                applyFilter(filter);
            });
        });

        
        const hash = window.location.hash.replace("#", "").toLowerCase();
        const urlParams = new URLSearchParams(window.location.search);
        const langParam = urlParams.get("lang");
        const initialFilter = ["id", "en", "all"].includes(hash) ? hash : (["id", "en", "all"].includes(langParam) ? langParam : "en");

        applyFilter(initialFilter);
    });
</script>

    <button id="back-to-top" class="back-to-top" aria-label="Back to top">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="18 15 12 9 6 15"></polyline>
        </svg>
    </button>

    <script>
        const hamburger = document.querySelector(".hamburger");
        const navMenu = document.querySelector(".nav-menu");

        if (hamburger) {
            hamburger.addEventListener("click", () => {
                hamburger.classList.toggle("active");
                navMenu.classList.toggle("active");
            });
        }

        
        const progressBar = document.getElementById("reading-progress");
        const article = document.querySelector(".article-content");
        if (progressBar && article) {
            window.addEventListener("scroll", () => {
                const rect = article.getBoundingClientRect();
                const totalHeight = article.offsetHeight;
                const windowHeight = window.innerHeight;
                const scrollOffset = -rect.top;
                const maxScroll = totalHeight - windowHeight + 100;
                const progress = Math.min(100, Math.max(0, (scrollOffset / maxScroll) * 100));
                progressBar.style.width = progress + "%";
            }, { passive: true });
        }

        
        document.querySelectorAll("pre").forEach((pre) => {
            const btn = document.createElement("button");
            btn.className = "copy-code-btn";
            btn.setAttribute("aria-label", "Copy code");
            btn.textContent = "Copy";
            btn.addEventListener("click", async () => {
                const code = pre.querySelector("code") || pre;
                try {
                    await navigator.clipboard.writeText(code.innerText);
                    btn.textContent = "Copied!";
                    btn.classList.add("copied");
                    setTimeout(() => {
                        btn.textContent = "Copy";
                        btn.classList.remove("copied");
                    }, 2000);
                } catch (err) {
                    btn.textContent = "Failed";
                }
            });
            pre.appendChild(btn);
        });

        
        const backToTopBtn = document.getElementById("back-to-top");
        if (backToTopBtn) {
            const toggleBackToTop = () => {
                const scrollY = window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0;
                if (scrollY > 180) {
                    backToTopBtn.classList.add("visible");
                } else {
                    backToTopBtn.classList.remove("visible");
                }
            };
            window.addEventListener("scroll", toggleBackToTop, { passive: true });
            toggleBackToTop();

            backToTopBtn.addEventListener("click", () => {
                window.scrollTo({ top: 0, behavior: "smooth" });
            });
        }

        
        document.querySelectorAll('a[href^="http://"], a[href^="https://"]').forEach(link => {
            if (link.hostname && link.hostname !== window.location.hostname) {
                link.setAttribute('target', '_blank');
                link.setAttribute('rel', 'noopener noreferrer');
            }
        });
    </script>
